<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>할리갈리 종은 어디에? - 외심 탐구 게임</title>
    <style>
        body {
            font-family: 'Pretendard', 'Arial', sans-serif;
            text-align: center;
            background-color: #fce4ec;
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        #game-card {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            position: relative;
        }
        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            background: #fff0f5;
            padding: 10px 20px;
            border-radius: 10px;
        }

        .canvas-container {
            position: relative;
            width: 500px;
            height: 500px;
            margin: 0 auto;
        }
        
        #top-score-banner {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            background-color: rgba(255, 243, 224, 0.95);
            border: 2px solid #ff9800;
            border-radius: 12px;
            padding: 8px 15px;
            display: none;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            z-index: 5;
            animation: fadeIn 0.2s ease-in-out;
        }
        .banner-item {
            font-size: 15px;
            font-weight: bold;
            color: #e65100;
        }
        .banner-score {
            font-size: 20px;
            color: #d84315;
            font-weight: 900;
        }

        canvas {
            border: 3px solid #ff80ab;
            background-color: #ffffff;
            cursor: pointer;
            border-radius: 12px;
            touch-action: none;
            box-sizing: border-box;
        }
        .btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            background-color: #ff4081;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.2s;
        }
        .btn:hover { background-color: #f50057; transform: translateY(-2px); }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; transform: none; }

        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ff80ab;
            border-radius: 8px;
            width: 70%;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .report-container {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 15px;
            border: 1px solid #ffe4e8;
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }
        th { 
            background-color: #ffe4e8; 
            position: sticky;
            top: 0;
            z-index: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -10px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
    </style>
</head>
<body>

<div id="game-card">
    <h2>🔔 할리갈리 종은 어디에 두지?</h2>

    <div id="start-screen">
        <p>친구들과 같은 거리에 종(🔔)을 놓아주세요!</p>
        <input type="text" id="nickname" placeholder="닉네임을 입력하세요" maxlength="8"><br>
        <button class="btn" onclick="startGame()">게임 시작하기</button>
    </div>

    <div id="play-screen" style="display:none;">
        <div class="header-panel">
            <span id="player-display"></span>
            <span id="stage-text">ROUND 1 / 8</span>
            <span id="score-text">총점: 0점</span>
        </div>

        <div class="canvas-container">
            <div id="top-score-banner">
                <div class="banner-item">🎯 라운드 점수: <span class="banner-score" id="banner-round-score">0점</span></div>
                <div class="banner-item">📏 <span id="banner-std-dev">거리의 오차: 0</span></div>
            </div>
            
            <canvas id="gameCanvas" width="500" height="500"></canvas>
        </div>
        
        <div id="instruction" style="margin-top: 10px; font-weight: bold; color: #444;">
            원하는 위치를 클릭하거나 누른 채로 끌어서 종(🔔)을 놓아보세요!
        </div>
        <div>
            <button id="confirm-btn" class="btn" onclick="confirmPosition()" disabled>이 위치에 종 놓기 (확인)</button>
            <button id="next-btn" class="btn" onclick="nextStage()" style="display:none;">다음 라운드 ➔</button>
        </div>
    </div>

    <div id="end-screen" style="display:none;">
        <h3>🎉 게임 종료! 🎉</h3>
        <p>수고하셨습니다, <strong id="final-player"></strong>님!</p>
        <div style="font-size: 36px; color: #ff4081; font-weight: bold; margin-bottom: 15px;" id="final-score">0점</div>
        
        <h4>📊 라운드별 상세 리포트</h4>
        <div class="report-container">
            <table>
                <thead>
                    <tr><th>라운드</th><th>유형</th><th>점수</th><th>거리 오차</th></tr>
                </thead>
                <tbody id="report-body"></tbody>
            </table>
        </div>

        <br>
        <button class="btn" onclick="restartGame()">다시하기 🔄</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let playerName = "";
let currentStage = 0;
let totalScore = 0;

let bellPoint = null;
let isDragging = false;
let isStageFinished = false;
let currentPoints = [];

let stageHistory = [];

const stageDefinitions = [
    { type: "line", name: "두 점" },
    { type: "line", name: "두 점" },
    { type: "equilateral", name: "정삼각형" },
    { type: "isosceles", name: "이등변삼각형" },
    { type: "right", name: "직각삼각형" },
    { type: "acute", name: "예각삼각형" },
    { type: "obtuse", name: "둔각삼각형" },
    { type: "random", name: "랜덤 삼각형" }
];

function isCollinear(p1, p2, p3) {
    const area = Math.abs(p1.x * (p2.y - p3.y) + p2.x * (p3.y - p1.y) + p3.x * (p1.y - p2.y));
    return area < 1500;
}

function generateRandomPoints(type) {
    const center = { x: 250, y: 250 };
    const margin = 80;
    
    const rotate = (cx, cy, x, y, angle) => {
        const radians = (Math.PI / 180) * angle;
        const cos = Math.cos(radians);
        const sin = Math.sin(radians);
        return {
            x: Math.round(cos * (x - cx) - sin * (y - cy) + cx),
            y: Math.round(sin * (x - cx) + cos * (y - cy) + cy)
        };
    };

    const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

    let points = [];
    let isValid = false;

    while (!isValid) {
        points = [];
        if (type === "line") {
            const dist = randInt(120, 180);
            const angle = randInt(0, 360);
            const p1 = { x: center.x - dist, y: center.y };
            const p2 = { x: center.x + dist, y: center.y };
            points = [rotate(center.x, center.y, p1.x, p1.y, angle), rotate(center.x, center.y, p2.x, p2.y, angle)];
            isValid = true;
        } else if (type === "equilateral") {
            const r = randInt(110, 150);
            const angle = randInt(0, 360);
            for (let i = 0; i < 3; i++) {
                const a = angle + i * 120;
                points.push({
                    x: Math.round(center.x + r * Math.cos((a * Math.PI) / 180)),
                    y: Math.round(center.y + r * Math.sin((a * Math.PI) / 180))
                });
            }
            isValid = true;
        } else if (type === "isosceles") {
            const base = randInt(200, 270);
            const height = randInt(140, 230);
            const angle = randInt(0, 360);
            const p1 = { x: center.x - base / 2, y: center.y + height / 2 };
            const p2 = { x: center.x + base / 2, y: center.y + height / 2 };
            const p3 = { x: center.x, y: center.y - height / 2 };
            points = [p1, p2, p3].map(p => rotate(center.x, center.y, p.x, p.y, angle));
            isValid = !isCollinear(points[0], points[1], points[2]);
        } else if (type === "right") {
            const w = randInt(180, 250);
            const h = randInt(180, 250);
            const angle = randInt(0, 360);
            const p1 = { x: center.x - w / 2, y: center.y - h / 2 };
            const p2 = { x: center.x - w / 2, y: center.y + h / 2 };
            const p3 = { x: center.x + w / 2, y: center.y + h / 2 };
            points = [p1, p2, p3].map(p => rotate(center.x, center.y, p.x, p.y, angle));
            isValid = !isCollinear(points[0], points[1], points[2]);
        } else if (type === "acute") {
            const r = randInt(120, 150);
            const baseAngle = randInt(0, 360);
            const a1 = baseAngle;
            const a2 = a1 + randInt(95, 130);
            const a3 = a2 + randInt(95, 130);
            [a1, a2, a3].forEach(a => {
                points.push({
                    x: Math.round(center.x + r * Math.cos((a * Math.PI) / 180)),
                    y: Math.round(center.y + r * Math.sin((a * Math.PI) / 180))
                });
            });
            isValid = !isCollinear(points[0], points[1], points[2]);
        } else if (type === "obtuse") {
            const r = randInt(120, 150);
            const baseAngle = randInt(0, 360);
            const a1 = baseAngle;
            const a2 = a1 + randInt(40, 75);
            const a3 = a2 + randInt(40, 75);
            [a1, a2, a3].forEach(a => {
                points.push({
                    x: Math.round(center.x + r * Math.cos((a * Math.PI) / 180)),
                    y: Math.round(center.y + r * Math.sin((a * Math.PI) / 180))
                });
            });
            isValid = !isCollinear(points[0], points[1], points[2]);
        } else if (type === "random") {
            for (let i = 0; i < 3; i++) {
                points.push({
                    x: randInt(margin, 500 - margin),
                    y: randInt(margin, 500 - margin)
                });
            }
            isValid = !isCollinear(points[0], points[1], points[2]);
        }
    }

    return points.map(p => ({
        x: Math.max(margin, Math.min(500 - margin, p.x)),
        y: Math.max(margin, Math.min(500 - margin, p.y))
    }));
}

function startGame() {
    const input = document.getElementById('nickname').value.trim();
    if (!input) {
        alert("닉네임을 입력해 주세요!");
        return;
    }
    playerName = input;
    stageHistory = [];
    document.getElementById('player-display').innerText = `👤 ${playerName}`;
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('play-screen').style.display = 'block';
    loadStage();
}

function loadStage() {
    bellPoint = null;
    isDragging = false;
    isStageFinished = false;
    
    currentPoints = generateRandomPoints(stageDefinitions[currentStage].type);

    document.getElementById('top-score-banner').style.display = 'none';
    document.getElementById('confirm-btn').style.display = 'inline-block';
    document.getElementById('confirm-btn').disabled = true;
    document.getElementById('next-btn').style.display = 'none';
    
    document.getElementById('stage-text').innerText = `ROUND ${currentStage + 1} / ${stageDefinitions.length}`;
    document.getElementById('instruction').innerText = "원하는 위치를 클릭하거나 누른 채로 끌어서 종(🔔)을 놓아보세요!";
    draw();
}

function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
    };
}

canvas.addEventListener('mousedown', function(e) {
    const pos = getCanvasPos(e);

    if (!bellPoint) {
        bellPoint = { x: pos.x, y: pos.y };
        isDragging = true;
        document.getElementById('confirm-btn').disabled = false;
        document.getElementById('instruction').innerText = "종(🔔)을 드래그해서 위치를 변경할 수 있습니다.";
    } else {
        if (Math.hypot(pos.x - bellPoint.x, pos.y - bellPoint.y) < 45) {
            isDragging = true;
        } else if (!isStageFinished) {
            bellPoint = { x: pos.x, y: pos.y };
            isDragging = true;
        }
    }
    draw();
});

canvas.addEventListener('mousemove', function(e) {
    if (!isDragging || !bellPoint) return;
    const pos = getCanvasPos(e);
    bellPoint.x = Math.max(20, Math.min(canvas.width - 20, pos.x));
    bellPoint.y = Math.max(20, Math.min(canvas.height - 20, pos.y));
    draw();
});

window.addEventListener('mouseup', function() {
    isDragging = false;
});

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let distances = null;
    let avgDist = null;

    if (bellPoint) {
        distances = currentPoints.map(p => Math.hypot(p.x - bellPoint.x, p.y - bellPoint.y));
        avgDist = distances.reduce((a, b) => a + b, 0) / distances.length;
    }

    if (isStageFinished && distances && avgDist && bellPoint) {
        ctx.beginPath();
        ctx.arc(bellPoint.x, bellPoint.y, avgDist, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 64, 129, 0.3)';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.stroke();
        ctx.setLineDash([]);

        currentPoints.forEach((p, idx) => {
            const distVal = Math.round(distances[idx]);

            ctx.beginPath();
            ctx.moveTo(bellPoint.x, bellPoint.y);
            ctx.lineTo(p.x, p.y);
            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 2;
            ctx.stroke();

            const midX = (bellPoint.x + p.x) / 2;
            const midY = (bellPoint.y + p.y) / 2;

            ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
            ctx.fillRect(midX - 16, midY - 10, 32, 20);
            ctx.strokeStyle = "#ff4081";
            ctx.lineWidth = 1;
            ctx.strokeRect(midX - 16, midY - 10, 32, 20);

            ctx.font = "bold 13px sans-serif";
            ctx.fillStyle = "#d81b60";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(distVal, midX, midY);
        });
    }

    currentPoints.forEach((p, idx) => {
        let emoji = "🙂";
        if (isStageFinished && distances && avgDist) {
            const diff = distances[idx] - avgDist;
            if (Math.abs(diff) > 20) {
                emoji = diff > 0 ? "😡" : "😄";
            } else {
                emoji = "😊";
            }
        }
        ctx.font = "32px serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(emoji, p.x, p.y);
    });

    if (bellPoint) {
        ctx.font = "38px serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("🔔", bellPoint.x, bellPoint.y);
    }
}

function confirmPosition() {
    if (isStageFinished || !bellPoint) return;
    isStageFinished = true;

    const distances = currentPoints.map(p => Math.hypot(p.x - bellPoint.x, p.y - bellPoint.y));
    const avgDist = distances.reduce((a, b) => a + b, 0) / distances.length;
    
    const variance = distances.reduce((a, b) => a + Math.pow(b - avgDist, 2), 0) / distances.length;
    const stdDev = Math.sqrt(variance);

    let roundScore = Math.max(0, Math.round(100 - (stdDev * 2.5)));
    totalScore += roundScore;

    stageHistory.push({
        round: currentStage + 1,
        typeName: stageDefinitions[currentStage].name,
        score: roundScore,
        stdDev: stdDev.toFixed(1)
    });

    draw();
    showTopScoreBanner(roundScore, stdDev);
}

function showTopScoreBanner(roundScore, stdDev) {
    document.getElementById('banner-round-score').innerText = `${roundScore}점`;
    document.getElementById('banner-std-dev').innerText = `거리의 오차: ${stdDev.toFixed(1)}`;
    document.getElementById('score-text').innerText = `총점: ${totalScore}점`;
    
    document.getElementById('top-score-banner').style.display = 'flex';
    document.getElementById('confirm-btn').style.display = 'none';

    const nextBtn = document.getElementById('next-btn');
    if (currentStage === stageDefinitions.length - 1) {
        nextBtn.innerText = "최종 점수 확인하기 🏆";
    } else {
        nextBtn.innerText = "다음 라운드 ➔";
    }
    nextBtn.style.display = 'inline-block';

    document.getElementById('instruction').innerText = "💡 종(🔔)을 끌어보며 실시간 오차 변화를 관찰해 보세요!";
}

function nextStage() {
    currentStage++;
    if (currentStage < stageDefinitions.length) {
        loadStage();
    } else {
        showFinalReportScreen();
    }
}

function showFinalReportScreen() {
    document.getElementById('play-screen').style.display = 'none';
    document.getElementById('end-screen').style.display = 'block';
    document.getElementById('final-player').innerText = playerName;
    document.getElementById('final-score').innerText = `${totalScore}점`;

    renderReportTable();
}

function renderReportTable() {
    const tbody = document.getElementById('report-body');
    tbody.innerHTML = "";
    stageHistory.forEach(item => {
        tbody.innerHTML += `
            <tr>
                <td>ROUND ${item.round}</td>
                <td>${item.typeName}</td>
                <td><strong>${item.score}점</strong></td>
                <td>${item.stdDev}</td>
            </tr>
        `;
    });
}

function restartGame() {
    currentStage = 0;
    totalScore = 0;
    stageHistory = [];
    document.getElementById('end-screen').style.display = 'none';
    document.getElementById('start-screen').style.display = 'block';
    document.getElementById('nickname').value = "";
}
</script>

</body>
</html>
